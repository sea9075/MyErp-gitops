# 從 Azure Key Vault 拉 SqlConnectionString / JwtSigningKey / ServiceBusConnectionString
# 三個 secret，合併寫成一個 K8s Secret（myerp-app-secrets），給 api/worker 兩個 Deployment
# 用 envFrom 整包注入（見 values.yaml 的 externalSecrets.mappings 註解）。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myerp-app-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.mappings }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
