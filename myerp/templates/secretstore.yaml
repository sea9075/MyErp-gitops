# ClusterSecretStore：告訴 External Secrets Operator 怎麼連去 Azure Key Vault（myerp-kv）。
# 用 Service Principal 認證（見 README「為什麼用 Service Principal」），不依賴 Azure Arc
# onboarding／Workload Identity（那個認證方式怎麼定案是獨立的待辦事項，不卡在這裡）。
#
# 2026-09-16 修正：這個 CRD 從 v1beta1 升級成 v1 是在 ESO 0.16.x 左右發生的（見
# github.com/external-secrets/external-secrets Issue #5478），實際裝出來是哪個版本
# 取決於 `helm install` 當下抓到的 chart 版本，不是看文件寫的版本就準——部署時如果又遇到
# "could not find version ... of external-secrets.io/..." 這種 ArgoCD sync 錯誤，
# 先用 `kubectl api-versions | grep external-secrets` 確認叢集實際裝的是哪個版本，
# 這裡的 apiVersion 要跟著改。
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStoreName }}
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: "{{ .Values.azureKeyVault.vaultUrl }}"
      tenantId: "{{ .Values.azureKeyVault.tenantId }}"
      # clientId/clientSecret 來自叢集端手動建立、不進 git 的 K8s Secret
      #（見 README「雞生蛋問題」，這是整條機密鏈唯一的例外）。
      authSecretRef:
        clientId:
          name: {{ .Values.azureKeyVault.spCredentialsSecretName }}
          namespace: {{ .Values.azureKeyVault.spCredentialsSecretNamespace }}
          key: ClientID
        clientSecret:
          name: {{ .Values.azureKeyVault.spCredentialsSecretName }}
          namespace: {{ .Values.azureKeyVault.spCredentialsSecretNamespace }}
          key: ClientSecret
